name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ vars.HOST }}
          username: ${{ vars.USERNAME }}
          # Private key must be a secret (masked in logs), never a repo variable.
          key: ${{ secrets.SSH_KEY }}

          # Run scripts/deploy.sh as it is on origin/main: fetch, hard-reset,
          # rebuild the artwork container, wait for it to answer HTTP.
          script: |
            set -e
            git -C ~/apps/apple-music-artwork-search fetch -q origin main
            git -C ~/apps/apple-music-artwork-search show origin/main:scripts/deploy.sh | bash
